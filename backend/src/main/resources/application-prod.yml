# Production Spring Profile Configuration
spring:
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 20000

app:
  cors:
    # In production, allowed origins must be explicitly specified via CORS_ALLOWED_ORIGINS.
    # Wildcard (*) is strictly forbidden as default in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
