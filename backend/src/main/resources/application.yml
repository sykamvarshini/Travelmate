server:
  port: ${PORT:8080}

spring:
  application:
    name: travelmate-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:travelmate_ai}?sslMode=VERIFY_IDENTITY&serverTimezone=Asia/Kolkata}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  admin:
    admin1:
      email: ${ADMIN1_EMAIL:}
      password: ${ADMIN1_PASSWORD:}
      name: ${ADMIN1_NAME:Administrator 1}
    admin2:
      email: ${ADMIN2_EMAIL:}
      password: ${ADMIN2_PASSWORD:}
      name: ${ADMIN2_NAME:Administrator 2}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
  external-apis:
    google-places:
      api-key: ${GOOGLE_PLACES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
    open-meteo:
      base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
    nominatim:
      base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    osrm:
      base-url: ${OSRM_BASE_URL:https://router.project-osrm.org}
  weights:
    preference: 0.40
    weather: 0.25
    time: 0.15
    budget: 0.10
    party: 0.10
